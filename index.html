<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Post-Date Evaluation</title><style>:root { --bg-color: #0b0f19; --card-bg: #131a2c; --accent-color: #3b82f6; --text-main: #f3f4f6; --text-muted: #9ca3af; --border-color: #1e293b; --danger-color: #ef4444; } * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; } body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; padding: 20px; } .container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 32px; width: 100%; max-width: 450px; text-align: center; min-height: 420px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; } .screen { display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; } .screen.active { display: flex; } h2 { font-size: 24px; margin-bottom: 12px; } p { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; } .live-score { font-size: 48px; font-weight: 700; color: var(--accent-color); margin-bottom: 16px; } .btn { background-color: var(--accent-color); color: white; border: none; padding: 12px 28px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 10px; } .button-arena { position: relative; width: 100%; height: 180px; margin-top: 10px; } #btn-no, #btn-yes { position: absolute; top: 50%; transform: translateY(-50%); } #btn-no { background-color: var(--danger-color); left: 60%; transition: left 0.1s ease-out, top 0.1s ease-out; touch-action: none; } #btn-yes { left: 20%; } .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; margin-bottom: 20px; max-height: 200px; overflow-y: auto; } .option-card { background-color: #1a233d; border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; } .option-card.selected { border-color: var(--accent-color); background-color: rgba(59, 130, 246, 0.15); }</style></head><body><div class="container" id="widget-container">
<div class="screen active" id="screen-1"><h2>Rate Our First Date</h2><p style="color:var(--text-muted)">Please provide honest clinical feedback.</p><div class="live-score" id="score-display">5</div><input type="range" id="enjoyment-slider" min="1" max="10" value="5" style="width:100%"><button class="btn" id="confirm-slider-btn">Submit Rating</button></div>
<div class="screen" id="screen-1-confirm"><div class="live-score">10/10</div><h2>YAY ME TOO!</h2><p style="color:var(--text-muted)">Your calibration metrics match perfectly.</p><button class="btn" id="to-screen-2-btn">Continue</button></div>
<div class="screen" id="screen-2"><h2>Go out with me again?</h2><div class="button-arena" id="arena"><button class="btn" id="btn-yes">Yes</button><button class="btn" id="btn-no">No</button></div></div>
<div class="screen" id="screen-3"><h2>Select Itinerary Elements</h2><div class="options-grid"><div class="option-card" data-value="Volleyball"><span>Volleyball 🏐</span></div><div class="option-card" data-value="Boba"><span>Boba 🧋</span></div><div class="option-card" data-value="Japanese"><span>Japanese 🍣</span></div><div class="option-card" data-value="Korean"><span>Korean 🍗</span></div><div class="option-card" data-value="Chinese"><span>Chinese 🥡</span></div><div class="option-card" data-value="Italian"><span>Italian 🍝</span></div><div class="option-card" data-value="Shawarma"><span>Shawarma 🌯</span></div></div><button class="btn" id="submit-itinerary-btn">Lock In Choices</button></div>
<div class="screen" id="screen-4"><div class="live-score">🎉</div><h2>System Protocols Complete!</h2><p id="final-summary"></p></div></div>
<script>
const selectedOptions = new Set(); const slider = document.getElementById('enjoyment-slider'); const scoreDisplay = document.getElementById('score-display'); const confirmSliderBtn = document.getElementById('confirm-slider-btn'); const toScreen2Btn = document.getElementById('to-screen-2-btn'); const btnNo = document.getElementById('btn-no'); const btnYes = document.getElementById('btn-yes'); const arena = document.getElementById('arena'); const container = document.getElementById('widget-container');
slider.addEventListener('input', (e) => { scoreDisplay.textContent = e.target.value; });
confirmSliderBtn.addEventListener('click', () => { document.getElementById('screen-1').classList.remove('active'); document.getElementById('screen-1-confirm').classList.add('active'); });
toScreen2Btn.addEventListener('click', () => { nextScreen(2); });
function nextScreen(n) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(`screen-${n}`).classList.add('active'); if(n === 2) { initEvasiveButton(); } }
function initEvasiveButton() { const arenaRect = arena.getBoundingClientRect(); const handleRepel = (e) => { const noRect = btnNo.getBoundingClientRect(); const containerRect = container.getBoundingClientRect(); let clientX = e.clientX, clientY = e.clientY; if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } const noCenterX = noRect.left + noRect.width / 2, noCenterY = noRect.top + noRect.height / 2; const deltaX = noCenterX - clientX, deltaY = noCenterY - clientY; const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY); if (distance < 100) { const force = (100 - distance) / 100, speed = 24; let moveX = (deltaX / (distance || 1)) * force * speed, moveY = (deltaY / (distance || 1)) * force * speed; let left = noRect.left + moveX, top = noRect.top + moveY; const pad = 20; if (left < containerRect.left + pad) left = containerRect.left + pad; if (left > containerRect.right - noRect.width - pad) left = containerRect.right - noRect.width - pad; if (top < containerRect.top + pad) top = containerRect.top + pad; if (top > containerRect.bottom - noRect.height - pad) top = containerRect.bottom - noRect.height - pad; btnNo.style.left = `${left - arenaRect.left}px`; btnNo.style.top = `${top - arenaRect.top}px`; } }; window.addEventListener('mousemove', handleRepel); window.addEventListener('touchmove', handleRepel, { passive: true }); }
btnYes.addEventListener('click', () => { nextScreen(3); });
document.querySelectorAll('.option-card').forEach(c => { c.addEventListener('click', () => { c.classList.toggle('selected'); const v = c.getAttribute('data-value'); if (selectedOptions.has(v)) { selectedOptions.delete(v); } else { selectedOptions.add(v); } }); });
document.getElementById('submit-itinerary-btn').addEventListener('click', () => { const chosen = Array.from(selectedOptions); document.getElementById('final-summary').innerHTML = chosen.length === 0 ? "Agenda set for everything!" : `Agenda confirmed with:<br><b style="color:#10b981">${chosen.join(', ')}</b>`; nextScreen(4); });
</script></body></html>
